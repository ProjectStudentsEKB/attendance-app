[project]
name = "attendance-app"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flet>=0.86.0",
    "supabase",
    "segno",
    "flet-geolocator",
    "flet-camera",
    "flet-permission-handler>=0.2.0",
    "pyzbar",
    "pillow"
]

# ВАЖНО: Указываем Flet распаковать pyzbar для Android
[tool.flet.android]
extract_packages = ["pyzbar"]

[tool.flet.android.permission]
"android.permission.CAMERA" = true
"android.permission.ACCESS_FINE_LOCATION" = true
"android.permission.ACCESS_COARSE_LOCATION" = true
