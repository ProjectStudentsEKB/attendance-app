[project]
name = "attendance-app"
version = "1.0.0"
dependencies = [
    "flet>=0.86.0",
    "flet-cli>=0.86.0",
    "supabase",
    "segno",
    "flet-geolocator",
    "flet-camera",
    "pyzbar",
    "pillow",
    "flet-permission-handler",
]

[tool.flet]
product = "Attendance App"
org = "com.attendance"

[tool.flet.android.permission]
"android.permission.CAMERA" = true
"android.permission.ACCESS_FINE_LOCATION" = true
"android.permission.ACCESS_COARSE_LOCATION" = true
